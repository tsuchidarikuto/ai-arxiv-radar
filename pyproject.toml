[project]
name = "ai-arxiv-radar"
version = "0.1.0"
description = "Daily cs.SE arXiv paper aggregator with Gemini categorization, Notion recording, and Slack notification"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "notion-client>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
